<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Income - SmartFinance</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body>


<div class="dashboard-layout">


<aside class="sidebar">

<div>

<div class="sidebar-logo">

<i class="fa-solid fa-wallet"></i>

<span>SmartFinance</span>

</div>


<nav class="sidebar-nav">

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>
Dashboard

</a>


<a href="income.html" class="active">

<i class="fa-solid fa-arrow-down"></i>
Income

</a>


<a href="expenses.html">

<i class="fa-solid fa-arrow-up"></i>
Expenses

</a>


<a href="analytics.html">

<i class="fa-solid fa-chart-pie"></i>
Analytics

</a>


<a href="ai-assistant.html">

<i class="fa-solid fa-robot"></i>
AI Assistant

</a>

</nav>

</div>


<div class="sidebar-bottom">
<a href="javascript:void(0)" onclick="AuthManager.logout()">
<i class="fa-solid fa-right-from-bracket"></i>
Sign Out
</a>
</div>

</aside>


<main class="dashboard-main">


<div class="topbar">
    <div>
        <h1>Income</h1>
        <p>Manage, filter, and track all your income sources.</p>
    </div>
    <a href="profile.html" class="profile-icon">
        <i class="fa-solid fa-user"></i>
    </a>
</div>

<div class="page-actions">
    <button class="navy-btn small-btn" onclick="openTransactionModal('income')">
        <i class="fa-solid fa-plus"></i> Add Income
    </button>
</div>

<div class="summary-grid">
    <div class="summary-card">
        <div class="summary-icon income-icon">
            <i class="fa-solid fa-money-bill-wave"></i>
        </div>
        <div>
            <span>Total Income</span>
            <h2>₹0</h2>
            <small>Current Month</small>
        </div>
    </div>

    <div class="summary-card">
        <div class="summary-icon">
            <i class="fa-solid fa-calendar-check"></i>
        </div>
        <div>
            <span>Total Entries</span>
            <h2>0</h2>
            <small>Income records</small>
        </div>
    </div>
</div>

<!-- FILTER & SEARCH TOOLBAR -->
<div id="incomeFilterToolbar" class="filter-toolbar"></div>

<div class="content-card">
    <div class="card-heading">
        <div>
            <h2>Income Transactions</h2>
            <p>All recorded earnings, salary, and side income</p>
        </div>
    </div>

    <div class="transaction-list">
        <!-- Rendered dynamically by script.js -->
    </div>
</div>


</main>

</div>

<script src="script.js"></script>
</body>
</html>
