<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Income - SmartFinance</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body>


<div class="dashboard-layout">


<aside class="sidebar">

<div>

<div class="sidebar-logo">

<i class="fa-solid fa-wallet"></i>

<span>SmartFinance</span>

</div>


<nav class="sidebar-nav">

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>
Dashboard

</a>


<a href="income.html" class="active">

<i class="fa-solid fa-arrow-down"></i>
Income

</a>


<a href="expenses.html">

<i class="fa-solid fa-arrow-up"></i>
Expenses

</a>


<a href="analytics.html">

<i class="fa-solid fa-chart-pie"></i>
Analytics

</a>


<a href="ai-assistant.html">

<i class="fa-solid fa-robot"></i>
AI Assistant

</a>

</nav>

</div>


<div class="sidebar-bottom">
<a href="javascript:void(0)" onclick="AuthManager.logout()">
<i class="fa-solid fa-right-from-bracket"></i>
Sign Out
</a>
</div>

</aside>


<main class="dashboard-main">


<div class="topbar">
    <div>
        <h1>Income</h1>
        <p>Manage, filter, and track all your income sources.</p>
    </div>
    <a href="javascript:void(0)" class="topbar-user-pill" id="topbarUserPill" onclick="toggleUserDropdown(event)">
        <img id="navUserAvatarImg" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2236%22%20height%3D%2236%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2250%22%20fill%3D%22%23173d82%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2254%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffffff%22%20font-family%3D%22sans-serif%22%20font-weight%3D%22700%22%20font-size%3D%2238%22%3EU%3C%2Ftext%3E%3C%2Fsvg%3E" alt="User" class="nav-user-avatar">
        <div class="nav-user-meta">
            <span id="navUserNameSpan" class="nav-user-name">Account</span>
        </div>
        <i class="fa-solid fa-chevron-down nav-user-arrow"></i>
    </a>
    <script>(function(){try{var u=JSON.parse(localStorage.getItem('sf_current_user'));if(u){var n=u.name||u.email||'Account';var s=document.getElementById('navUserNameSpan');if(s)s.textContent=n;var a=document.getElementById('navUserAvatarImg');if(a&&u.picture)a.src=u.picture;}}catch(e){}})();</script>
</div>

<div class="summary-grid">
    <div class="summary-card">
        <div class="summary-icon income-icon">
            <i class="fa-solid fa-money-bill-wave"></i>
        </div>
        <div>
            <span>Total Income</span>
            <h2>₹0</h2>
            <small>Current Month</small>
        </div>
    </div>

    <div class="summary-card">
        <div class="summary-icon">
            <i class="fa-solid fa-list-check"></i>
        </div>
        <div>
            <span>Total Entries</span>
            <h2>0</h2>
            <small>Income records</small>
        </div>
    </div>

    <div class="page-actions-card">
        <button class="navy-btn small-btn" onclick="openTransactionModal('income')">
            <i class="fa-solid fa-plus"></i> Add Income
        </button>
    </div>
</div>

<!-- FILTER & SEARCH TOOLBAR -->
<div id="incomeFilterToolbar" class="filter-toolbar"></div>

<div class="content-card">
    <div class="card-heading">
        <div>
            <h2>Income Transactions</h2>
            <p>All recorded earnings, salary, and side income</p>
        </div>
    </div>

    <div class="transaction-list">
        <!-- Rendered dynamically by script.js -->
    </div>
</div>


</main>

</div>

<script src="script.js"></script>
</body>
</html>
