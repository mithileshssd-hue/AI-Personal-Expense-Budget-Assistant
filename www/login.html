<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - SmartFinance</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body class="auth-page">

<!-- Ambient Animated Glow Elements -->
<div class="auth-ambient-glow glow-1"></div>
<div class="auth-ambient-glow glow-2"></div>
<div class="auth-ambient-glow glow-3"></div>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-top-badge">
            <i class="fa-solid fa-shield-halved"></i> Bank-Grade Security
        </div>

        <div class="auth-logo">
            <div class="logo-icon-box">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <span>Smart<span class="logo-highlight">Finance</span></span>
        </div>


        <div class="auth-heading">
            <h1>Welcome Back</h1>
            <p>Sign in to your intelligent financial workspace</p>
        </div>


        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="name@example.com"
                        required
                    >
                </div>
            </div>


            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="••••••••"
                        required
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Toggle password visibility">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>
                <a href="javascript:void(0)" onclick="showForgotPasswordModal()">Forgot Password?</a>
            </div>

            <button type="submit" class="navy-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>

        </form>


        <div class="auth-divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <!-- Google Sign-In -->
        <div class="google-auth-wrap">
            <div id="googleSignInDiv" style="display:none;"></div>

            <button type="button" class="google-btn-custom" id="googleCustomBtn" onclick="triggerGoogleSignIn()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.27v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.59H1.27C.46 8.2 0 10.05 0 12s.46 3.8 1.27 5.41l4.01-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.27 6.59l4.01 3.15c.95-2.84 3.6-4.99 6.72-4.99z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
        </div>

        <div style="text-align:center; margin-top:10px;">
            <a href="javascript:void(0)" onclick="showGoogleSetupModal()" style="font-size:0.78rem; color:#94a3b8; text-decoration:none; display:inline-flex; align-items:center; gap:5px;">
                <i class="fa-solid fa-gear"></i> Configure Google Client ID
            </a>
        </div>

        <p class="auth-bottom">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

    </div>

</div>

<!-- Google Identity Services Client -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="script.js"></script>
<script>
function quickFillDemo() {
    document.getElementById('loginEmail').value = 'alex.finance@gmail.com';
    document.getElementById('loginPassword').value = 'demo123';
    showToast('Demo credentials filled! Click "Sign In" to continue.', 'info');
}
</script>
</body>
</html>
