<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SmartFinance</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="auth-page">

<!-- Ambient Animated Glow Elements -->
<div class="auth-ambient-glow glow-1"></div>
<div class="auth-ambient-glow glow-2"></div>
<div class="auth-ambient-glow glow-3"></div>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-top-badge">
            <i class="fa-solid fa-sparkles"></i> Get Started Free
        </div>

        <div class="auth-logo">
            <div class="logo-icon-box">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <span>Smart<span class="logo-highlight">Finance</span></span>
        </div>


        <div class="auth-heading">
            <h1>Create Account</h1>
            <p>Start tracking and growing your wealth today</p>
        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="navy-btn">
                <i class="fa-solid fa-user-plus"></i>
                Create Account
            </button>
        </form>

        <div class="auth-divider">
            <span>OR SIGN UP WITH</span>
        </div>

        <div class="google-auth-wrap">
            <div id="googleSignInDiv"></div>
            <button type="button" class="google-btn-custom" onclick="triggerGoogleSignIn()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.27v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.59H1.27C.46 8.2 0 10.05 0 12s.46 3.8 1.27 5.41l4.01-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.27 6.59l4.01 3.15c.95-2.84 3.6-4.99 6.72-4.99z"/>
                </svg>
                <span>Sign up with Google</span>
            </button>
        </div>

        <p class="auth-bottom">
            Already have an account?
            <a href="login.html">
                Sign In
            </a>
        </p>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="script.js"></script>
</body>
</html>
